<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Growth Community</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent-color: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; transition: all 0.3s ease; }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-main);
            padding: 30px 15px;
            display: flex;
            justify-content: center;
        }

        .container { width: 100%; max-width: 900px; }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            margin-bottom: 25px;
        }

        h2 { font-size: 1.4rem; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }

        input, textarea {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            padding: 14px 18px;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            margin-top: 10px;
        }

        input[type="file"] {
            cursor: pointer;
            padding: 10px;
        }

        input:focus, textarea:focus { border-color: var(--accent-color); box-shadow: 0 0 10px var(--accent-glow); }

        .btn-action {
            width: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 15px;
        }

        .btn-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-add, .btn-minus, .btn-kick, .btn-delete {
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-right: 2px;
        }

        .btn-add { background: #10b981; }
        .btn-minus { background: #f59e0b; }
        .btn-kick { background: #ef4444; margin-left: 10px; }
        .btn-kick:hover { background: #b91c1c; }

        .btn-delete { background: #ef4444; padding: 8px 12px; }

        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; margin-top: 10px; }
        th { color: var(--text-muted); font-weight: 600; text-align: left; padding: 10px 15px; }
        td { background: rgba(255, 255, 255, 0.03); padding: 12px 15px; border-top: 1px solid var(--glass-border); border-bottom: 1px solid var(--glass-border); }
        td:first-child { border-left: 1px solid var(--glass-border); border-radius: 12px 0 0 12px; }
        td:last-child { border-right: 1px solid var(--glass-border); border-radius: 0 12px 12px 0; }

        .news-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border); padding: 12px 18px; border-radius: 12px; margin-top: 10px; }
        .file-label { display: block; margin-top: 12px; color: var(--text-muted); font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <!-- Admin Parol Bilan Kirish -->
    <div id="login-box" class="card" style="max-width: 450px; margin: 50px auto;">
        <h2><i class="fa-solid fa-lock" style="color: #6366f1;"></i> Admin Kirish</h2>
        <input type="password" id="admin-pass" placeholder="Admin parolini kiriting...">
        <button class="btn-action" onclick="checkPassword()"><i class="fa-solid fa-right-to-bracket"></i> Kirish</button>
    </div>

    <!-- Admin Boshqaruv Paneli -->
    <div id="admin-dashboard" style="display:none;">
        
        <!-- Rasmiy E'lon Jo'natish -->
        <div class="card">
            <h2><i class="fa-solid fa-bullhorn" style="color: #c084fc;"></i> Rasmiy E'lon va Rasm Joylash</h2>
            <textarea id="announcement-text" rows="3" placeholder="E'lon matnini kiriting..."></textarea>
            
            <label class="file-label"><i class="fa-solid fa-image"></i> Kompyuterdan rasm tanlang (ixtiyoriy):</label>
            <input type="file" id="announcement-file" accept="image/*">

            <button class="btn-action" id="post-btn" onclick="postAnnouncement()"><i class="fa-solid fa-paper-plane"></i> E'lonni Chop Etish</button>
        </div>

        <!-- Yuborilgan E'lonlarni O'chirish -->
        <div class="card">
            <h2><i class="fa-solid fa-trash-can" style="color: #ef4444;"></i> Yuborilgan E'lonlar va Ularni O'chirish</h2>
            <div id="news-management-list">E'lonlar yuklanmoqda...</div>
        </div>

        <!-- O'quvchilarni Boshqarish -->
        <div class="card">
            <h2><i class="fa-solid fa-users-gear" style="color: #38bdf8;"></i> O'quvchilarni Boshqarish</h2>
            <table>
                <thead>
                    <tr>
                        <th>Ism</th>
                        <th>Kod</th>
                        <th>Ball</th>
                        <th>Ball berish va Chiqarib yuborish</th>
                    </tr>
                </thead>
                <tbody id="student-list"></tbody>
            </table>
        </div>

    </div>
</div>

<script>
    const ADMIN_PASSWORD = "12345";

    const SUPABASE_URL = "https://hdgikkxjnfxzzpiqujvl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_iSEwPuZi560nIxxvcjdPDA_rySiE4q0";

    const { createClient } = window.supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    function checkPassword() {
        const inputPass = document.getElementById('admin-pass').value;
        if (inputPass === ADMIN_PASSWORD) {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('admin-dashboard').style.display = 'block';
            loadStudents();
            loadNewsForAdmin();
        } else {
            alert("Noto'g'ri parol!");
        }
    }

    async function loadStudents() {
        const { data } = await db.from('students').select('*').order('id', { ascending: false });
        if (data) {
            let html = '';
            data.forEach(s => {
                html += `
                    <tr>
                        <td><strong>${s.name}</strong></td>
                        <td><span style="color: #fbbf24; font-family: monospace;">${s.code}</span></td>
                        <td><strong style="color: #10b981;">${s.points}</strong> ball</td>
                        <td>
                            <button class="btn-add" onclick="updatePoints(${s.id}, ${s.points}, 5)">+5</button>
                            <button class="btn-add" style="background:#3b82f6;" onclick="updatePoints(${s.id}, ${s.points}, 10)">+10</button>
                            <button class="btn-minus" onclick="updatePoints(${s.id}, ${s.points}, -5)">-5</button>
                            
                            <button class="btn-kick" onclick="deleteStudent(${s.id}, '${s.name}')"><i class="fa-solid fa-user-xmark"></i> Chiqarib yuborish</button>
                        </td>
                    </tr>
                `;
            });
            document.getElementById('student-list').innerHTML = html || "<tr><td colspan='4'>Hozircha o'quvchilar yo'q.</td></tr>";
        }
    }

    async function updatePoints(id, currentPoints, pointsChange) {
        let newPoints = currentPoints + pointsChange;
        if (newPoints < 0) newPoints = 0;
        await db.from('students').update({ points: newPoints }).eq('id', id);
        loadStudents();
    }

    async function deleteStudent(id, name) {
        if (confirm(`Rostdan ham ${name} ismli o'quvchini tizimdan chiqarib yubormoqchimisiz?`)) {
            await db.from('students').delete().eq('id', id);
            loadStudents();
        }
    }

    async function postAnnouncement() {
        const text = document.getElementById('announcement-text').value.trim();
        const fileInput = document.getElementById('announcement-file');
        const file = fileInput.files[0];
        const postBtn = document.getElementById('post-btn');

        if (!text) return alert("E'lon matnini kiriting!");

        let imageUrl = null;

        // Agar rasm tanlangan bo'lsa
        if (file) {
            postBtn.innerText = "Rasm yuklanmoqda...";
            postBtn.disabled = true;

            // Fayl nomidagi xato beruvchi harflarni to'g'rilash
            const cleanFileName = file.name.replace(/[^a-zA-Z0-9.]/g, "_");
            const fileName = `${Date.now()}_${cleanFileName}`;

            // Supabase Storage'dagi IMAGE nomli bucket'ga yuklash
            const { data, error } = await db.storage.from('IMAGE').upload(fileName, file);

            if (error) {
                alert("Rasm yuklashda xatolik: " + error.message);
                postBtn.innerText = "E'lonni Chop Etish";
                postBtn.disabled = false;
                return;
            }

            // Public linkini olish
            const { data: publicUrlData } = db.storage.from('IMAGE').getPublicUrl(fileName);
            imageUrl = publicUrlData.publicUrl;
        }

        // Database (news) ga saqlash
        const { error: dbError } = await db.from('news').insert([{ 
            author_name: "Admin", 
            content: text, 
            image_url: imageUrl,
            is_admin: true 
        }]);

        if (dbError) {
            alert("E'lonni saqlashda xatolik: " + dbError.message);
        } else {
            alert("E'lon va rasm muvaffaqiyatli chop etildi!");
            document.getElementById('announcement-text').value = '';
            fileInput.value = '';
        }

        postBtn.innerText = "E'lonni Chop Etish";
        postBtn.disabled = false;
        loadNewsForAdmin();
    }

    async function loadNewsForAdmin() {
        const { data } = await db.from('news').select('*').order('id', { ascending: false });
        if (data) {
            let html = '';
            data.forEach(n => {
                html += `
                    <div class="news-item">
                        <div><strong>${n.author_name || 'Admin'}:</strong> ${n.content.substring(0, 40)}...</div>
                        <button class="btn-delete" onclick="deleteNews(${n.id})"><i class="fa-solid fa-trash"></i> O'chirish</button>
                    </div>
                `;
            });
            document.getElementById('news-management-list').innerHTML = html || "Hozircha e'lonlar yo'q.";
        }
    }

    async function deleteNews(id) {
        if (confirm("E'lonni o'chirishni tasdiqlaysizmi?")) {
            await db.from('news').delete().eq('id', id);
            loadNewsForAdmin();
        }
    }
</script>

</body>
</html>
