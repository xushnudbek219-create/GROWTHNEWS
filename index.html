<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growth Community | Rasmiy Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent-color: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; transition: all 0.3s ease; }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-main);
            padding: 30px 15px;
            display: flex;
            justify-content: center;
        }

        .container { width: 100%; max-width: 850px; }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2.2rem; font-weight: 800; background: linear-gradient(90deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { color: var(--text-muted); margin-top: 5px; }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            margin-bottom: 25px;
        }

        h2 { font-size: 1.3rem; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; color: #e2e8f0; }

        .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }
        .tab-btn.active { background: var(--accent-color); color: white; border-color: var(--accent-color); }

        input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            padding: 14px 18px;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            margin-bottom: 12px;
        }

        input:focus { border-color: var(--accent-color); box-shadow: 0 0 10px var(--accent-glow); }

        .btn {
            width: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-glow); }

        .news-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 15px;
        }

        .news-header { display: flex; justify-content: space-between; margin-bottom: 10px; color: var(--text-muted); font-size: 0.85rem; }
        .news-author { color: #818cf8; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .news-img { width: 100%; max-height: 350px; object-fit: cover; border-radius: 12px; margin-top: 12px; border: 1px solid var(--glass-border); }

        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; margin-top: 10px; }
        th { color: var(--text-muted); font-weight: 600; text-align: left; padding: 10px 15px; }
        td { background: rgba(255, 255, 255, 0.03); padding: 14px 15px; border-top: 1px solid var(--glass-border); border-bottom: 1px solid var(--glass-border); }
        td:first-child { border-left: 1px solid var(--glass-border); border-radius: 12px 0 0 12px; }
        td:last-child { border-right: 1px solid var(--glass-border); border-radius: 0 12px 12px 0; }

        .code-badge { background: rgba(99, 102, 241, 0.2); color: #818cf8; padding: 6px 12px; border-radius: 8px; font-weight: 600; font-family: monospace; }
        .user-welcome-box { background: rgba(99, 102, 241, 0.1); border: 1px solid var(--accent-color); padding: 20px; border-radius: 16px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>GROWTH COMMUNITY</h1>
        <p>O'quvchilar va O'qituvchilar Interaktiv Portali</p>
    </div>

    <!-- Tizimga Kirish / Ro'yxatdan O'tish Paneli -->
    <div class="card" id="auth-card">
        <div class="tab-buttons">
            <button class="tab-btn active" id="tab-login-btn" onclick="switchTab('login')">Tizimga Kirish</button>
            <button class="tab-btn" id="tab-reg-btn" onclick="switchTab('register')">Yangi Ro'yxatdan O'tish</button>
        </div>

        <!-- Tizimga Kirish Formasi -->
        <div id="login-form">
            <h2><i class="fa-solid fa-right-to-bracket" style="color: #6366f1;"></i> Profilga Kirish</h2>
            <input type="text" id="login-name" placeholder="Ism va Familiyangizni kiriting...">
            <input type="password" id="login-code" placeholder="5 xonali kodingizni kiriting...">
            <button class="btn" onclick="loginUser()"><i class="fa-solid fa-key"></i> Kirish</button>
        </div>

        <!-- Ro'yxatdan O'tish Formasi -->
        <div id="reg-form" style="display: none;">
            <h2><i class="fa-solid fa-user-plus" style="color: #10b981;"></i> Yangi O'quvchi Ro'yxatdan O'tishi</h2>
            <input type="text" id="reg-name" placeholder="Ism va Familiyangizni kiriting...">
            <button class="btn" style="background: linear-gradient(90deg, #10b981, #059669);" onclick="registerUser()"><i class="fa-solid fa-user-check"></i> Kod Olish va Ro'yxatdan O'tish</button>
        </div>
    </div>

    <!-- Xush Kelibsiz Profil Paneli -->
    <div class="card" id="profile-card" style="display: none;">
        <div class="user-welcome-box">
            <h3 style="font-size: 1.3rem; margin-bottom: 8px;">Xush kelibsiz, <span id="profile-name" style="color: #818cf8;"></span>! 👋</h3>
            <p style="color: var(--text-muted); margin-bottom: 12px;">Sizning maxsus kodingiz: <strong class="code-badge" id="profile-code"></strong> | Ballingiz: <strong style="color:#10b981;" id="profile-points">0</strong> ball</p>
            <button style="background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #94a3b8; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem;" onclick="logoutUser()">Chiqish</button>
        </div>
    </div>

    <!-- Rasmiy E'lonlar -->
    <div class="card">
        <h2><i class="fa-solid fa-newspaper" style="color: #c084fc;"></i> Rasmiy E'lonlar</h2>
        <div id="news-feed">E'lonlar yuklanmoqda...</div>
    </div>

    <!-- Reyting Jadvali -->
    <div class="card">
        <h2><i class="fa-solid fa-trophy" style="color: #fbbf24;"></i> O'quvchilar Reytingi</h2>
        <table>
            <thead>
                <tr>
                    <th>O'rin</th>
                    <th>Ism</th>
                    <th>Maxsus Kod</th>
                    <th>Ball</th>
                </tr>
            </thead>
            <tbody id="leaderboard"></tbody>
        </table>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://hdgikkxjnfxzzpiqujvl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_iSEwPuZi560nIxxvcjdPDA_rySiE4q0";

    const { createClient } = window.supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    function switchTab(tab) {
        if (tab === 'login') {
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('reg-form').style.display = 'none';
            document.getElementById('tab-login-btn').classList.add('active');
            document.getElementById('tab-reg-btn').classList.remove('active');
        } else {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('reg-form').style.display = 'block';
            document.getElementById('tab-reg-btn').classList.add('active');
            document.getElementById('tab-login-btn').classList.remove('active');
        }
    }

    // Tizimga Kirish (Ism + Kod tekshirish)
    async function loginUser() {
        const name = document.getElementById('login-name').value.trim();
        const code = document.getElementById('login-code').value.trim();

        if (!name || !code) return alert("Iltimos, ism va kodingizni kiriting!");

        // Baza orqali tekshiramiz
        const { data, error } = await db.from('students').select('*').eq('code', code);

        if (data && data.length > 0) {
            const user = data[0];
            // Ismi ham mos keladimi? (Registrga qaramyik)
            if (user.name.toLowerCase() === name.toLowerCase()) {
                showProfile(user.name, user.code, user.points);
            } else {
                alert("Xatolik: Ushbu kod boshqa ismga tegishli yoki ism noto'g'ri kiritilgan!");
            }
        } else {
            alert("Xatolik: Noto'g'ri kod kiritildi yoki bunday foydalanuvchi mavjud emas!");
        }
    }

    // Yangi Ro'yxatdan O'tish (Ism avval mavjud bo'lsa ro'yxatdan o'tkazmaydi)
    async function registerUser() {
        const nameInput = document.getElementById('reg-name').value.trim();
        if (!nameInput) return alert("Iltimos, ism va familiyangizni kiriting!");

        // Avval bu ism bazada bormi-yo'qligini tekshiramiz
        const { data: existing } = await db.from('students').select('*').ilike('name', nameInput);

        if (existing && existing.length > 0) {
            alert("Bu Ism va Familiya avval ro'yxatdan o'tgan! 'Tizimga kirish' bo'limi orqali kodingizni kiritib kiring.");
            switchTab('login');
            document.getElementById('login-name').value = nameInput;
            return;
        }

        const randomCode = Math.floor(10000 + Math.random() * 90000).toString();

        const { data, error } = await db.from('students').insert([{ name: nameInput, code: randomCode, points: 0 }]);

        if (error) {
            alert("Xatolik yuz berdi: " + error.message);
        } else {
            alert(`Muvaffaqiyatli ro'yxatdan o'tdingiz!\nSizning kodingiz: ${randomCode}\nUshbu kodni eslab qoling!`);
            showProfile(nameInput, randomCode, 0);
            loadLeaderboard();
        }
    }

    function showProfile(name, code, points) {
        document.getElementById('auth-card').style.display = 'none';
        document.getElementById('profile-card').style.display = 'block';
        document.getElementById('profile-name').innerText = name;
        document.getElementById('profile-code').innerText = code;
        document.getElementById('profile-points').innerText = points;
    }

    function logoutUser() {
        document.getElementById('profile-card').style.display = 'none';
        document.getElementById('auth-card').style.display = 'block';
        document.getElementById('login-name').value = '';
        document.getElementById('login-code').value = '';
    }

    async function loadLeaderboard() {
        const { data, error } = await db.from('students').select('*').order('points', { ascending: false });
        if (data) {
            let html = '';
            data.forEach((student, index) => {
                let badgeClass = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `#${index + 1}`;
                html += `
                    <tr>
                        <td><strong>${badgeClass}</strong></td>
                        <td>${student.name}</td>
                        <td><span class="code-badge">${student.code}</span></td>
                        <td><strong style="color: #10b981;">${student.points}</strong> ball</td>
                    </tr>
                `;
            });
            document.getElementById('leaderboard').innerHTML = html || "<tr><td colspan='4'>Hozircha hech kim ro'yxatdan o'tmadi.</td></tr>";
        }
    }

    async function loadNews() {
        const { data, error } = await db.from('news').select('*').order('id', { ascending: false });
        if (data) {
            let html = '';
            data.forEach(n => {
                html += `
                    <div class="news-card">
                        <div class="news-header">
                            <span class="news-author"><i class="fa-solid fa-circle-check"></i> ${n.author_name}</span>
                        </div>
                        <p style="font-size: 1.05rem; line-height: 1.5;">${n.content}</p>
                        ${n.image_url ? `<img src="${n.image_url}" class="news-img" alt="E'lon rasmi">` : ''}
                    </div>
                `;
            });
            document.getElementById('news-feed').innerHTML = html || "Hozircha e'lonlar yo'q.";
        }
    }

    loadLeaderboard();
    loadNews();
</script>

</body>
</html>
